<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LembraAI - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7fdff;
        color: #1f2937;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .card {
        width: min(92vw, 440px);
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.35rem;
        color: #fd6400;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>LembraAI</h1>
      <p>You are offline right now. Please reconnect to continue studying your decks.</p>
    </main>
  </body>
</html>
